# Development-only stack. Supply secrets through the untracked root .env file.
services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: movie_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: movie_streaming_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backend Node (JS + Socket.IO)
  backend-node:
    build: ./backend-node
    container_name: backend_node
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:rootpassword@db:3306/movie_streaming_db
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_secret_khoa_watch_party_12345}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  # Frontend React
  frontend:
    build: ./frontend
    container_name: frontend_react
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
