# Development-only stack. Supply secrets through the untracked root .env file.
services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: movie_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: movie_streaming_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: zflix_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Backend Node (JS)
  backend-node:
    build: ./backend-node
    container_name: backend_node
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:rootpassword@db:3306/movie_streaming_db
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ISSUER: Zflix
      MFA_CHALLENGE_TTL_SECONDS: 300
      MFA_CHALLENGE_MAX_ATTEMPTS: 5
      MFA_RATE_LIMIT_MAX: 20
      ACCESS_TOKEN_TTL: 15m
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 5
      REFRESH_IDLE_TTL_DAYS: 7
      REFRESH_ABSOLUTE_TTL_DAYS: 30
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
      FORGOT_PASSWORD_RATE_LIMIT_MAX: 5
      RESET_PASSWORD_RATE_LIMIT_MAX: 10
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
      VIDEO_WEBHOOK_SECRET: ${VIDEO_WEBHOOK_SECRET:-}
      VIDEO_SERVICE_URL: http://video_service:8001
      VISION_PROVIDER: ${VISION_PROVIDER:-none}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund --no-package-lock && npx prisma generate && npm run migrate:auth && npm run migrate:toxic-content && npm run dev"

  # Python Video Service
  video-processor:
    build: ./backend-python/video-processor
    container_name: video_service
    ports:
      - "8001:8001"
    volumes:
      - ./backend-python/video-processor:/app
    environment:
      # boto3 cần endpoint hợp lệ ngay khi import; dùng placeholder để service
      # vẫn khởi động khi chưa cấu hình R2 (upload sẽ báo lỗi khi gọi thật).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-dev-placeholder}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-dev-placeholder}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-dev-placeholder}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-dev-placeholder}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
      NODE_WEBHOOK_URL: ${NODE_WEBHOOK_URL:-http://backend-node:3000/api/streaming/episodes/webhook/video-done}
      VIDEO_WEBHOOK_SECRET: ${VIDEO_WEBHOOK_SECRET:-}
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --app-dir src --host 0.0.0.0 --port 8001 --reload"

  # Python AI Service
  ai-chatbot:
    build: ./backend-python/ai-chatbot
    container_name: ai_service
    ports:
      - "8002:8002"
    volumes:
      - ./backend-python/ai-chatbot:/app
    command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload"

  # Frontend React
  frontend:
    build: ./frontend
    container_name: frontend_react
    ports:
      - "5173:5173"
    environment:
      # De trong de frontend tu goi API theo host dang mo (localhost hoac IP LAN).
      # Chi dat VITE_API_URL trong .env goc khi API nam o may khac.
      - VITE_API_URL=${VITE_API_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    command: sh -c "npm install --no-audit --no-fund --no-package-lock && npm run dev"

volumes:
  db_data:
  elastic_data:
